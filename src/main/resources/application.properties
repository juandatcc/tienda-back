spring.application.name=electronicos

# Puerto del servidor
server.port=8080

# === Base de datos (variables de entorno con valor por defecto para desarrollo local) ===
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:electronico}
spring.datasource.password=${DB_PASSWORD:electronico0929}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate
# El esquema de Oracle se gestiona a mano (sql/): Hibernate solo valida, nunca modifica la BD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

# === JWT ===
security.jwt.secret=${JWT_SECRET:1234567890123456789123456789ABCD1234}

# === Registro de admins (usado en AuthService.register) ===
security.admin.register-code=${ADMIN_REGISTER_CODE:ADMIN-2025}

# === CORS: orígenes permitidos separados por coma ===
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# === Supabase Storage (imágenes de productos) ===
# La clave secreta nunca va en el repo: usa SUPABASE_SECRET_KEY o secrets.properties (ignorado por git)
spring.config.import=optional:file:./secrets.properties
supabase.url=${SUPABASE_URL:https://huaocmtqzwegtotuadib.supabase.co}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage.bucket=${SUPABASE_BUCKET:productos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Ruta de assets del frontend (puedes usar una ruta absoluta o relativa al proyecto)
frontend.assets.path=frontend/assets

# Nota: para liberar un puerto ocupado en PowerShell:
# netstat -ano | findstr :8080
# Stop-Process -Id <PID> -Force
