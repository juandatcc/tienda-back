spring.application.name=electronicos

# Puerto dinámico para evitar conflicto con procesos que ocupen 8080
server.port=8080

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=electronico
spring.datasource.password=electronico0929
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate
# Revertido a 'none' para evitar modificaciones automáticas en la BD en producción
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# === JWT ===
security.jwt.secret=1234567890123456789123456789ABCD1234

# === Registro de admins (si lo usas en AuthService.register) ===
security.admin.register-code=ADMIN-2025

# Ruta de assets del frontend (puedes usar una ruta absoluta o relativa al proyecto)
frontend.assets.path=frontend/assets

# Nota: si quieres usar un puerto fijo (p. ej. 8080 o 8082), cambia server.port al puerto deseado
# Para liberar el puerto en PowerShell:
# netstat -ano | findstr :8080
# Stop-Process -Id <PID> -Force
